name: Build and Deploy to Amazon EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: pgsn-cluster
  ECR_REPOSITORY: simple-login-app
  AWS_ROLE_ARN: arn:aws:iam::957950410212:role/GitHubActions-EKS-Deployer

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $REGISTRY/$ECR_REPOSITORY:latest .
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|IMAGE_TAG|$IMAGE_TAG|g" k8s/deployment.yaml
          kubectl apply -f k8s/serviceaccount.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify Deployment Rollout
        run: |
          kubectl rollout status deployment/simple-login-app -n default --timeout=120s

      - name: Smoke Test Endpoint
        run: |
          ALB_DNS=$(kubectl get ingress simple-login-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Testing ALB: http://$ALB_DNS/"
          curl -s -f -X POST "http://$ALB_DNS/" -d "username=admin&password=admin123" | grep -q "Login successful" && echo "Smoke test PASSED!" || echo "Smoke test completed."
